name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: input
    id: version
    attributes:
      label: cortex-agent version
      description: Run `cortex-agent --version` or check pyproject.toml
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Run `python --version`
      placeholder: "3.11.5"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 10/11
        - Linux (distro in additional context)
        - macOS (version in additional context)
        - WSL2 (distro in additional context)
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware (GPU/CPU/RAM)
      description: Relevant for local LLM stack issues
      placeholder: "RTX 3080 10GB, Ryzen 7 5800X, 32GB RAM"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug
      placeholder: |
        1. Run `cortex-agent`
        2. Type "create a file..."
        3. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste relevant logs (redact API keys, paths, sensitive data)
      render: shell
      placeholder: |
        Traceback (most recent call last):
          File "...", line X, in ...
            ...
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant config (redact API keys)
      render: yaml
      placeholder: |
        BASE_URL: ...
        API_KEY: ***
        MODEL: ...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information, screenshots, or context
      placeholder: |
        - OS: Ubuntu 22.04
        - GPU: RTX 3080 10GB
        - Using smart installer: yes
    validations:
      required: false