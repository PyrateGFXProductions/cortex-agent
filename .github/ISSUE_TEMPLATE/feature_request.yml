name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? What's the use case?
      placeholder: |
        Currently, users cannot...
        This would help users who...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
      placeholder: |
        Add a new option `--xyz` that...
        Or extend the smart installer to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've considered
      placeholder: |
        - Option A: ... (pros/cons)
        - Option B: ... (pros/cons)
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the project does this affect?
      options:
        - Core agent (cortex_agent/)
        - Smart installer (smart_installer/)
        - WSL2 setup script
        - MCP server
        - Documentation
        - Installation methods
        - Efficiency patterns
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, related issues, or references
      placeholder: |
        Related to #123
        See also: https://example.com/reference
    validations:
      required: false