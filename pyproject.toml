[project]
name = "cortex-agent"
version = "0.2.0"
description = "Reference implementation of context-window efficiency patterns for AI coding agents"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "openai>=3.5.0",
    "prompt-toolkit>=3.0.53",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "ai-agent",
    "coding-agent",
    "context-window",
    "efficiency-patterns",
    "llm",
    "vllm",
    "lmcache",
    "mcp",
    "smart-installer",
]
authors = [
    {name = "PyrateGFX Productions", email = "pyrategfxproductions@gmail.com"},
]
urls = {
    Homepage = "https://github.com/PyrateGFXProductions/cortex-agent",
    Repository = "https://github.com/PyrateGFXProductions/cortex-agent",
    Issues = "https://github.com/PyrateGFXProductions/cortex-agent/issues",
    Documentation = "https://github.com/PyrateGFXProductions/cortex-agent#documentation",
    Changelog = "https://github.com/PyrateGFXProductions/cortex-agent/blob/main/CHANGELOG.md",
}

[project.optional-dependencies]
mcp = ["mcp>=1.9"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.3.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
cortex-agent = "cortex_agent.agent:main"
cortex-agent-mcp = "cortex_agent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T10", "T20", "PTH", "ERA", "PL", "TRY", "NPY"]
ignore = ["S101", "S311", "T201", "T203"]
exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.black]
line-length = 100
target-version = ["py310"]
skip-string-normalization = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["cortex_agent"]