[project]
name = "cortex-agent"
version = "0.2.0"
description = "A minimal coding agent harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.5.0",
    "prompt-toolkit>=3.0.53",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.9"]

[project.scripts]
cortex-agent = "cortex_agent.agent:main"
cortex-agent-mcp = "cortex_agent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
